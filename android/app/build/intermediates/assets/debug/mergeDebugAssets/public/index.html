<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: 'Arial', sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background: #f0f0f0;
        }

        .calculator {
          background: #fff;
          padding: 20px;
          border-radius: 25px;
          box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
          width: 90%;
          max-width: 380px;
          display: flex;
          flex-direction: column;
        }

        #display {
          width: 100%;
          height: 50px;
          font-size: 1.5rem;
          text-align: right;
          margin-bottom: 10px;
          padding: 10px;
          border: 2px solid #ccc;
          border-radius: 10px;
          background: #fefefe;
          color: #333;
        }

        .buttons {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 15px;
        }

        .buttons button {
          padding: 25px;
          font-size: 2rem;
          border: none;
          background: #f1f1f1;
          border-radius: 12px;
          cursor: pointer;
          transition: background 0.3s;
        }

        .buttons button:hover {
          background: #e0e0e0;
        }

        .buttons button:active {
          background: #ccc;
        }

        .buttons button.clear {
          background: #ff4d4d;
          color: white;
        }

        .buttons button.equals {
          background: #4CAF50;
          color: white;
          grid-column: span 1;
        }

        .buttons button.backspace {
          background: #fbc02d;
          color: white;
        }

        @media (max-width: 480px) {
          .buttons button {
            padding: 20px;
            font-size: 1.8rem;
          }

          #display {
            font-size: 2rem;
            height: 70px;
          }
        }
    </style>
</head>
<body>

<div class="calculator">
    <form id="calc-form">
        <input type="text" id="display" name="display" readonly />
        <div class="buttons">
            <button type="button" class="btn clear">C</button>
            <button type="button" class="btn backspace">←</button>
            <button type="button" class="btn">/</button>
            <button type="button" class="btn">*</button>

            <button type="button" class="btn">7</button>
            <button type="button" class="btn">8</button>
            <button type="button" class="btn">9</button>
            <button type="button" class="btn">-</button>

            <button type="button" class="btn">4</button>
            <button type="button" class="btn">5</button>
            <button type="button" class="btn">6</button>
            <button type="button" class="btn">+</button>

            <button type="button" class="btn">1</button>
            <button type="button" class="btn">2</button>
            <button type="button" class="btn">3</button>
            <button type="button" class="btn equals">=</button>


            <button type="button" class="btn" style="grid-column: span 2;">0</button>
            <button type="button" class="btn" style="grid-column: span 2;">.</button>
        </div>

        <input type="hidden" id="result" name="result" />
    </form>
</div>

<script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll(".btn");
    const resultField = document.getElementById("result");
    const form = document.getElementById("calc-form");

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const value = button.textContent;

        if (value === "C") {
          display.value = "";
        } else if (value === "←") {
          display.value = display.value.slice(0, -1);
        } else if (value === "=") {
          try {
            const evalResult = eval(display.value);
            display.value = evalResult;
            resultField.value = display.value;
            // You can send to backend here if needed
          } catch {
            display.value = "Error";
          }
        } else {
          display.value += value;
        }
      });
    });
</script>
</body>
</html>
